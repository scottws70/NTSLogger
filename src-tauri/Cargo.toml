[package]
name = "N8VCL-NTS-Traffic-Logger"
version = "1.1.1"
description = "Log, sort, book, relay and deliver NTS radiogram traffic"
authors = ["N8VCL"]
license = "MIT"
repository = "https://github.com/scottws70/NTSLogger"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
