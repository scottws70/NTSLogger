[package]
name = "N8VCL-NTS-Traffic-Logger"
version = "1.4.1"
description = "Log, sort, book, relay and deliver NTS radiogram traffic"
authors = ["N8VCL"]
license = "MIT"
repository = "https://github.com/scottws70/NTSLogger"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
# preserve_order keeps the fields of the stored traffic in the order the page saved them
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# In-app updates and one-copy-at-a-time (desktop only)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
